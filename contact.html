<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar-container">
        <div class="navbar left">
            <h1 class="logo">Loch Vale</h1>
        </div>

        <div class="navbar right">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="data.html">Data</a>
            <a class="nav-link" href="links.html">Links</a>
            <a class="nav-link" href="stories.html">Stories</a>
            <a class="nav-link" href="publications.html">Publications</a>
            <a class="nav-link" href="contact.html">People</a>
        </div>
    </div>
    <!-- Navbar End -->

    <div class="page-container">

        <h2 style="text-align: center;">People</h2>

        <h3>Principal Investigators</h3>
        <div id="pi"></div>

        <script>
        fetch("./data/pi.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("pi");
            publications.forEach(p => {
            container.innerHTML += `
                <div class="contact-container">
                    <img class="contact-img" src="${p.pic_name}" alt="${p.name}">
                    <p class="contact-name">${p.name}</p>
                </div>
            `;
            });
        });
        </script>


        <h3>Graduate Students</h3>
        <div id="grad-students"></div>

        <script>
        fetch("./data/grad-students.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("grad-students");

            container.innerHTML += `
                <div class="contact-container">
                    <img class="contact-img" src="${g.pic_name}" alt="${g.name}">
                    <p class="contact-name">${g.name}</p>
                </div>
            `;
            });
        });
        </script>

        <h3>Researchers</h3>
        <div id="researchers"></div>

        <script>
        fetch("./data/researchers.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("researchers");
            publications.forEach(r => {
            container.innerHTML += `
                <div class="contact-container">
                    <img class="contact-img" src="${r.pic_name}" alt="${r.name}">
                    <p class="contact-name">${r.name}</p>
                </div>
            `;
            });
        });
        </script>
    </div>

</body>
</html>
