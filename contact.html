<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar-container">
        <div class="navbar left">
            <h1 class="logo">Loch Vale</h1>
        </div>

        <div class="navbar right">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="data.html">Data</a>
            <a class="nav-link" href="links.html">Links</a>
            <a class="nav-link" href="stories.html">Stories</a>
            <a class="nav-link" href="publications.html">Publications</a>
            <a class="nav-link" href="contact.html">People</a>
        </div>
    </div>
    <!-- Navbar End -->

    <div class="page-container">

        <h2 style="text-align: center;">People</h2>



        <h3 class="people-section-title">Principal Investigators</h3>
        <div id="pi"></div>

        <script>
        fetch("./data/pi.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("pi");
            publications.forEach(p => {
            container.innerHTML += `
                <div class="contact-container">
                    <img class="contact-img" src="${p.pic_name}" alt="${p.name}">
                    <div class="contact-details">
                        <p class="contact-name">${p.name}</p>
                        <div class="contact-affiliations">
                            ${(p.logos || []).map(logo => `
                                <img src="${logo.src}" alt="${logo.alt}" loading="lazy">
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
            });
        });
        </script>


        <h3 class="people-section-title">Graduate Students</h3>
        <div id="grad-students"></div>

        <script>
        fetch("./data/grad-students.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("grad-students");
            publications.forEach(g => {
            container.innerHTML += `
                <div class="contact-container">
                    ${g.pic_name ? `<img class="contact-img" src="${g.pic_name}" alt="${g.name}">` : ""}
                    <div class="contact-details">
                        <p class="contact-name">${g.name}</p>
                        <div class="contact-affiliations">
                            ${(g.logos || []).map(logo => `
                                <img src="${logo.src}" alt="${logo.alt}" loading="lazy">
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
            });
        });
        </script>

        <h3 class="people-section-title">Researchers</h3>
        <div id="researchers"></div>

        <script>
        fetch("./data/researchers.json")
        .then(response => response.json())
        .then(publications => {
            const container = document.getElementById("researchers");
            publications.forEach(r => {
            container.innerHTML += `
                <div class="contact-container">
                    <img class="contact-img" src="${r.pic_name}" alt="${r.name}">
                    <div class="contact-details">
                        <p class="contact-name">${r.name}</p>
                        <div class="contact-affiliations">
                            ${(r.logos || []).map(logo => `
                                <img src="${logo.src}" alt="${logo.alt}" loading="lazy">
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
            });
        });
        </script>
    </div>

</body>
</html>
